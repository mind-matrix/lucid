name: Verify

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check physical CSS (i18n gate)
        run: bun run check:physical-css

      - name: Lint (Biome)
        run: bun run lint

      - name: Build packages
        run: bun run build:packages

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      # Baselines are per-platform, and they are authored on whatever machine
      # the developer used — so a component added on macOS arrives with no
      # Linux baseline. This pass creates only the *missing* ones.
      #
      # `=missing` is load-bearing: it never touches a baseline that already
      # exists, so a genuine visual regression cannot be silently rebaselined
      # here. Missing snapshots are still reported as failures by design,
      # which is why the pass is allowed to fail.
      - name: Create any missing Linux baselines
        run: bunx playwright test --update-snapshots=missing || true

      # The real gate. `=none` forbids writing snapshots at all, so this can
      # only pass by matching what is on disk.
      - name: Accessibility + visual regression (strict)
        run: bunx playwright test --update-snapshots=none

      - name: Commit new Linux baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Two directory levels — baselines live in <Component>/test/__snapshots__.
          git add "packages/components/src/*/test/__snapshots__/*-chromium-linux.png"
          if ! git diff --cached --quiet; then
            git commit -m "chore(visual): add Linux baselines [skip ci]"
            git push
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
